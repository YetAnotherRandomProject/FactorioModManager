name: Release

# Publier une version : mettre à jour `version` dans Cargo.toml, commiter, puis
#   git tag v0.2.0 && git push origin v0.2.0
# Les installateurs sont construits et attachés à la release GitHub ; l'application
# installée détecte la nouvelle release et propose la mise à jour.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Builds natifs : même dossier target/release que la CI, donc même cache.
          - name: windows
            os: windows-latest
            formats: nsis
            target: ""
            out: target/release
          - name: linux
            os: ubuntu-22.04
            formats: appimage,deb
            target: ""
            out: target/release
          - name: macos-arm64
            os: macos-latest
            formats: dmg
            target: ""
            out: target/release
          # Mac Intel : compilation croisée depuis le runner ARM (les runners Intel sont retirés).
          - name: macos-x64
            os: macos-latest
            formats: dmg
            target: x86_64-apple-darwin
            out: target/x86_64-apple-darwin/release
    runs-on: ${{ matrix.os }}
    env:
      TARGET_ARG: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libfuse2 file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Clé partagée avec la CI : la release réutilise le build release déjà fait sur master.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          key: ${{ matrix.target }}

      - name: Cache cargo-packager
        id: packager-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-packager.exe
          key: cargo-packager-${{ env.CARGO_PACKAGER_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-packager
        if: steps.packager-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-packager --locked --version ${{ env.CARGO_PACKAGER_VERSION }}

      - name: Build
        shell: bash
        run: cargo build --release --locked $TARGET_ARG

      - name: Build installer
        shell: bash
        run: cargo packager --release --formats ${{ matrix.formats }} $TARGET_ARG

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            ${{ matrix.out }}/*-setup.exe
            ${{ matrix.out }}/*.AppImage
            ${{ matrix.out }}/*.deb
            ${{ matrix.out }}/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    # Publie ce qui a été construit même si une plateforme a échoué.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List installers
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
