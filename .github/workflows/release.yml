name: Release

# Publier une version : mettre à jour `version` dans Cargo.toml, commiter, puis
#   git tag v0.2.0 && git push origin v0.2.0
# Les installateurs sont construits et attachés à la release GitHub ; l'application
# installée détecte la nouvelle release et propose la mise à jour.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            formats: nsis
            files: target/release/*-setup.exe
          - name: linux
            os: ubuntu-22.04
            formats: appimage,deb
            files: |
              target/release/*.AppImage
              target/release/*.deb
          - name: macos-arm64
            os: macos-latest
            formats: dmg
            files: target/release/*.dmg
          - name: macos-x64
            os: macos-13
            formats: dmg
            files: target/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev libfuse2 file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build installer
        run: cargo packager --release --formats ${{ matrix.formats }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
