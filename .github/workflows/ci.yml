name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      # Clé partagée avec le workflow de release, qui réutilise ce build.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build

      - name: Tests
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: FactorioModManager-${{ runner.os }}
          path: |
            target/release/FactorioModManager
            target/release/FactorioModManager.exe
          if-no-files-found: error
